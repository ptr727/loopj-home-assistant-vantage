start_task:
  name: Start task
  description: Start a Vantage task.
  fields:
    id:
      name: Task ID
      description: The ID of the Vantage task to start.
      selector:
        number:
          min: 1
          max: 99999
          mode: box
    name:
      name: Task name
      description: The name of the Vantage task to start.
      selector:
        text:

stop_task:
  name: Stop task
  description: Stop a Vantage task.
  fields:
    id:
      name: Task ID
      description: The ID of the Vantage task to stop.
      selector:
        number:
          min: 1
          max: 99999
          mode: box
    name:
      name: Task name
      description: The name of the Vantage task to stop.
      selector:
        text:

get_trigger_history:
  name: Get trigger history
  description: >-
    Read the controller's trigger history: which object (button, timer, sensor)
    started which task, newest entries last for each master. Times are in controller local time.
  fields:
    limit:
      name: Limit
      description: The maximum number of entries to return, per master.
      default: 100
      selector:
        number:
          min: 1
          max: 5000
          mode: box

get_system_log:
  name: Get system log
  description: Read the controller's system log, newest entries last for each master.
  fields:
    limit:
      name: Limit
      description: The maximum number of entries to return, per master.
      default: 100
      selector:
        number:
          min: 1
          max: 5000
          mode: box
